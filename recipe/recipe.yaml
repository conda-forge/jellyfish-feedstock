schema_version: 1

context:
  name: jellyfish
  version: "1.3.0"
  bundle: tar.gz
  hash: fd77ba8e1c9835d2c56b11bde6765380cbcac333037974c4ba4b60092c383212

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/${{ name[0] }}/${{ name }}/${{ name }}-${{ version }}.${{ bundle }}
  sha256: ${{ hash }}
  file_name: ${{ name }}-${{ version }}.${{ bundle }}

build:
  # Also skip for when ppc64le AND python<3.10 due to Maturin no support for now
  number: 1
  skip: match(python, "<3.7") or (match(python, "<3.10") and ppc64le)
  script:
    - cargo-bundle-licenses --format yaml --output THIRDPARTY.yml
    - ${{ PYTHON }} -m pip install . -vv

requirements:
  build:
    - cargo-bundle-licenses
    - if: build_platform != target_platform
      then: python
    - if: build_platform != target_platform
      then: cross-python_${{ target_platform }}
    - ${{ compiler('c') }}
    - ${{ stdlib("c") }}
    - ${{ compiler('rust') }}
    - if: build_platform != target_platform
      then: maturin >=0.14,<2
  host:
    - maturin >=0.14,<2
    - pip
    - python
  run:
    - python

tests:
  - python:
      imports:
        - jellyfish
      pip_check: true

about:
  license: BSD-2-Clause
  license_file:
    - LICENSE
    - THIRDPARTY.yml
  summary: A library for doing approximate and phonetic matching of strings.
  homepage: https://github.com/jamesturk/jellyfish
  repository: https://github.com/jamesturk/jellyfish
  documentation: https://jamesturk.github.io/jellyfish/

extra:
  recipe-maintainers:
    - blabalme
    - anthchirp
    - thewchan
